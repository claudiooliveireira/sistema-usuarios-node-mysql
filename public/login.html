<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administração </title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ecf5fd; height: 100vh; display: flex; align-items: center;}
        .login-card {
            max-width: 400px; width: 100%; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white;
        }

    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">Acesso Restrito</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required placeholder="admin@teste.com" >
            </div>
            <div>
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary w-100" >Entrar</button>

        </form>
        <div id="mensagem" class="mt-3 text-center"></div>
    </div>

    <script src="loginScript.js"></script>
</body>
</html>
