<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Gerenciador de Usuários</title>
</head>
<body class="bg-light">
    <!-- Cadastrar novos usuários ( Formulário )-->

    <div class="card shadow mb-4">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Cadastrar Novo Usuário</h4>
        </div>
        

        <!-- Formulário-->
        <div class="card-body">
        <form id="form-cadastro" class="row g-3">
            <div class="col-md-5">
                <input type="text" id="nome" class="form-control" placeholder="Nome completo" required>
            </div>
            <div class="col-md-5">
                <input type="email"  id="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Cadastrar</button>
            </div>
        </form>

        </div>
    </div>

    <!-- Tabela de usuários -->
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0" >Lista de Usuários (MySQL + Node)</h2>
            </div>
            <div class="card-body">
                <!-- Tabela -->
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <!-- Corpo da tabela-->
                    <tbody id="tabela-corpo"> </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Editar usuário,  janela para edição -->

    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" >Editar Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId"> 
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text"  id="editNome" class="form-label form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" >E-mail</label>
                        <input type="email" id="editEmail" class="form-label form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarEdicao()" >Salvar mudanças</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Área dos Toasts ( Notificações )-->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    <!-- A mensagem será inserida aqui via JS -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- o JavaScript do bootstrap (necessário para os modais funcionarem )-->
    <script src="script.js"></script>
    
</body>
</html>
