<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Gerenciador de Usuários</title>
</head>
<body class="bg-light">
    <!-- Cadastrar novos usuários ( Formulário )-->

    <div class="card shadow mb-4">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Cadastrar Novo Usuário</h4>
        </div>
        

        <!-- Formulário-->
        <div class="card-body">
        <form id="form-cadastro" class="row g-3">
            <div class="col-md-5">
                <input type="text" id="nome" class="form-control" placeholder="Nome completo" required>
            </div>
            <div class="col-md-5">
                <input type="email"  id="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Cadastrar</button>
            </div>
        </form>

        </div>
    </div>









    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0" >Lista de Usuários (MySQL + Node)</h2>
            </div>
            <div class="card-body">
                <!-- Tabela -->
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <!-- Corpo da tabela-->
                    <tbody id="tabela-corpo"> </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
